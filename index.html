<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil de Abdo</title>
    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>
    <header>
      
<img 
    src="images/profil.jpg"
    alt="Photo de profil de Abdelghafour Zhouri"
    class="profile-image"
>
       
       
        <h1 id="mainTitle">Abdelghafour Zhouri</h1>
        <button id="themeBtn">Mode sombre</button>
        <p id="tagline">Data scientist</p>
        <button id="changeTitleBtn">Changer le titre</button>

       
    </header>
    <main>
        <section>
            <h2>À propos</h2>
            <p>Je suis Abdelghafour Zhouri, un étudiant en licence data science à la Faculté des Sciences d'El Jadida
                (Université Chouaïb Doukkali).</p>
        </section>
        <section>
            <h2>Compétences</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Python</li>
                <li>Git</li>
            </ul>
        </section>
        <section>
            <h2>Contact</h2>
            <form id="contactForm">
                <label for="nameInput">Nom</label>
                <input id="nameInput" type="text" name="nameInput" required>
                <label for="emailInput">Email</label>
                <input id="emailInput" type="email" name="emailInput" required>
                <label for="messageInput">Message</label>
                <textarea id="messageInput" name="messageInput" required></textarea>
                <button type="submit">Envoyer</button>
                <p id="formMessage"></p>
            </form>
        </section>
        <section>
            <h2>Personnalisez votre carte</h2>
            <label for="liveInput">Votre nom</label>
            <input id="liveInput" type="text">
            <p id="liveText"></p>
        </section>
        <section>
            <h2>Compteur</h2>
            <button id="counterBtn">Like</button>
            <span id="counterValue">0</span>
        </section>

    </main>
    <script src="JS/script.js"></script>
</body>

</html>
